<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud2Tech Business Card — Front & Back</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:40px;background:#dfe7f1;font-family:Arial,sans-serif;color:#102a43}.wrap{max-width:1200px;margin:auto}.intro{text-align:center;margin-bottom:28px}.intro h1{margin:0 0 8px;font-size:30px}.intro p{margin:0;color:#61758a}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 45px #0002}.label{text-align:center;font-weight:700;margin:0 0 14px;color:#1557c0}.card{width:100%;aspect-ratio:1050/600;overflow:hidden;border-radius:12px}.card img{display:block;width:100%;height:100%;object-fit:contain}.note{text-align:center;margin-top:26px;color:#61758a;font-size:14px}@media(max-width:800px){body{padding:20px}.cards{grid-template-columns:1fr}.panel{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <h1>Cloud2Tech Business Card</h1>
    <p>V2-inspired design · Front and Back preview</p>
  </div>
  <div class="cards">
    <section class="panel"><div class="label">FRONT</div><div class="card"><img src="cloud2tech-business-card-front.svg" alt="Cloud2Tech business card front"></div></section>
    <section class="panel"><div class="label">BACK</div><div class="card"><img src="cloud2tech-business-card-back.svg" alt="Cloud2Tech business card back"></div></section>
  </div>
  <p class="note">Both sides are shown together so neither side is hidden. Open this file in a browser to review the complete card.</p>
</div>
</body>
</html>
