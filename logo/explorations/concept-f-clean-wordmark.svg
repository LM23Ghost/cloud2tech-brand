<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Cloud2Tech Concept F</title>
<desc id="desc">Clean Cloud2Tech wordmark with a connected cloud replacing the o and a subtle robot shaped as the capital T.</desc>
<rect width="1200" height="320" fill="white"/>
<g transform="translate(55 55)">
  <!-- C -->
  <text x="0" y="155" font-family="Poppins,Montserrat,Arial,sans-serif" font-size="122" font-weight="600" fill="#1557C0">Cl</text>
  <!-- Cloud used as the o: deliberately simple and readable -->
  <g transform="translate(135 57)">
    <path d="M18 73h88c20 0 36-14 36-32s-16-32-36-32c-3 0-6 0-9 1C90 2 76-5 60-5 38-5 20 10 15 30 6 33 0 41 0 51c0 12 8 22 18 22Z" fill="none" stroke="#11AFC3" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="43" cy="49" r="5" fill="#F5C542"/>
    <circle cx="74" cy="49" r="5" fill="#F5C542"/>
    <path d="M49 65h20" stroke="#1557C0" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- ud -->
  <text x="300" y="155" font-family="Poppins,Montserrat,Arial,sans-serif" font-size="122" font-weight="600" fill="#1557C0">ud2</text>
  <!-- Tech, with robot-T integrated into the actual T silhouette -->
  <text x="610" y="155" font-family="Poppins,Montserrat,Arial,sans-serif" font-size="122" font-weight="600" fill="#1557C0">ech</text>
  <g transform="translate(570 37)">
    <!-- T-shaped robot: head/shoulder bar + vertical body -->
    <path d="M0 18h108v30H74v103H34V48H0Z" fill="#1557C0"/>
    <!-- antenna -->
    <path d="M54 18V3" stroke="#11AFC3" stroke-width="6" stroke-linecap="round"/>
    <circle cx="54" cy="0" r="5" fill="#F5C542"/>
    <!-- eyes -->
    <circle cx="43" cy="33" r="4" fill="white"/>
    <circle cx="65" cy="33" r="4" fill="white"/>
    <!-- subtle mouth/circuit detail -->
    <path d="M46 42h16" stroke="#11AFC3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="33" r="3" fill="#F5C542"/>
    <circle cx="88" cy="33" r="3" fill="#F5C542"/>
  </g>
  <!-- baseline accent -->
  <path d="M0 190h1050" stroke="#E7EDF5" stroke-width="2"/>
</g>
</svg>